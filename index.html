<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NoteGo Privacy</title>
<style>
/* Layout: one reading column; language buttons on top switch the whole text. */
:root {
  --bg: #F5F7FA; --surface: #FFFFFF; --ink: #13203A; --muted: #556175; --line: #DDE3EB;
  --accent: #1F56B3; --accent-soft: #E4ECFA;
  --f-body: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0D131C; --surface: #151D29; --ink: #E5EBF4; --muted: #9AA7BA; --line: #253142;
  --accent: #78A2F2; --accent-soft: #1B2A45; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0D131C; --surface: #151D29; --ink: #E5EBF4; --muted: #9AA7BA; --line: #253142;
  --accent: #78A2F2; --accent-soft: #1B2A45; color-scheme: dark; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 17px; line-height: 1.6;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 28px 64px; }
.wrap { max-width: 720px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }
.brand { font-weight: 800; font-size: 1.1rem; letter-spacing: -0.01em; }
.brand span { color: var(--accent); }
.langs { display: flex; flex-wrap: wrap; gap: 8px; }
.langs button { font: inherit; font-size: .9rem; font-weight: 600; min-height: 40px; padding: 0 14px; border-radius: 999px;
  border: 1px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer; }
.langs button[aria-pressed="true"] { background: var(--accent); color: var(--surface); border-color: var(--accent); }
.langs button:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
h1 { margin: 0; font-size: 2rem; line-height: 1.15; letter-spacing: -0.02em; text-wrap: balance; }
.date { margin: 4px 0 0; color: var(--muted); font-size: .95rem; }
.summary { margin: 0; background: var(--accent-soft); border-radius: 14px; padding: 14px 18px; }
section h2 { margin: 0 0 4px; font-size: 1.1rem; text-wrap: balance; }
section p { margin: 0; max-width: 65ch; }
article { display: flex; flex-direction: column; gap: 18px; }
a { color: var(--accent); }
</style>
</head>
<body>
<div class="wrap">
  <div class="brand">Note<span>Go</span></div>
  <nav class="langs" id="langs" aria-label="Language"></nav>
  <article id="doc" lang="en"></article>
</div>

en: { name: "English", title: "Privacy Policy", valid: "Effective", summary: "NoteGo has no user accounts, no ads and no tracking. Your notes stay on your device.", s: [

["Уведомления", "Напоминания планируются локально на вашем устройстве и не проходят через наши серверы."],

["Правовое основание и ваши права", "Данные из сообщений о проблемах мы обрабатываем для предоставления услуги и на основании законного интереса (ст. 6(1)(b) и (f) GDPR). Вы имеете право на доступ, исправление, удаление, ограничение обработки и возражение. Пишите на " + EMAIL + ". Жалобу можно подать в австрийский орган по защите данных: " + DSB + "."],

var order = ["hr", "de", "en", "es", "ru", "pt"];
var langs = document.getElementById("langs");
var doc = document.getElementById("doc");

function pick() {
  var h = (location.hash || "").replace("#", "");
  if (T[h]) return h;
  var n = (navigator.language || "en").slice(0, 2);
  if (n === "bs" || n === "sr") n = "hr";
  return T[n] ? n : "en";
}

function render(code) {
  var t = T[code];
  doc.lang = code;
  doc.innerHTML = "";
  var head = document.createElement("header");
  head.innerHTML = "<h1>" + t.title + " · NoteGo</h1><p class='date'>" + t.valid + ": " + DATE[code] + "</p>";
  doc.appendChild(head);
  var sum = document.createElement("p");
  sum.className = "summary";
  sum.textContent = t.summary;
  doc.appendChild(sum);
  t.s.forEach(function (sec) {
    var el = document.createElement("section");
    el.innerHTML = "<h2></h2><p>" + sec[1] + "</p>";
    el.querySelector("h2").textContent = sec[0];
    doc.appendChild(el);
  });
  Array.prototype.forEach.call(langs.children, function (b) {
    b.setAttribute("aria-pressed", b.dataset.code === code ? "true" : "false");
  });
  document.title = t.title + " – NoteGo";
}

order.forEach(function (code) {
  var b = document.createElement("button");
  b.type = "button";
  b.dataset.code = code;
  b.textContent = T[code].name;
  b.addEventListener("click", function () { render(code); });
  langs.appendChild(b);
});

render(pick());
</script>

</html>
